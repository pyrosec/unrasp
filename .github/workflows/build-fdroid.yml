name: Build, Sign & Publish to F-Droid

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.0)'
        required: false

env:
  GCP_PROJECT: project-ghost-695752
  GCS_BUCKET: ghost-android-releases

jobs:
  build-sign-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Extract version info ──────────────────────────────────
      - name: Get version info
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          fi
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/[^0-9]//g')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Building version $VERSION (code $VERSION_CODE)"

      # ── Set up build environment ──────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'

      # ── Build APK ─────────────────────────────────────────────
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      # ── Sign APK ──────────────────────────────────────────────
      - name: Sign APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Download uber-apk-signer
          curl -sL -o uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

          # Decode keystore from base64 secret
          echo "$ANDROID_KEYSTORE" | base64 -d > release.keystore

          # Find the release APK
          APK=$(find app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "Signing APK: $APK"

          # Sign
          java -jar uber-apk-signer.jar \
            --apks "$APK" \
            --ks release.keystore \
            --ksPass "$ANDROID_KEYSTORE_PASSWORD" \
            --ksKeyPass "$ANDROID_KEY_PASSWORD" \
            --ksAlias "$ANDROID_KEY_ALIAS" \
            --allowResign \
            --out signed-output

          # Clean up keystore
          rm -f release.keystore

          ls -la signed-output/

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: signed-output/*.apk

      # ── Publish to F-Droid (f-droid.pyrosec.is) ───────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
          install_components: 'gke-gcloud-auth-plugin'

      - name: Upload APK to GCS and update F-Droid repo
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Rename to F-Droid naming convention
          SIGNED_APK=$(ls signed-output/*.apk | head -1)
          FDROID_APK_NAME="is.pyrosec.unrasp_v${VERSION}.apk"
          cp "$SIGNED_APK" "signed-output/${FDROID_APK_NAME}"
          cp "$SIGNED_APK" "signed-output/is.pyrosec.unrasp.apk"

          # Upload to GCS
          gsutil cp "signed-output/${FDROID_APK_NAME}" \
            "gs://${GCS_BUCKET}/fdroid-staging/${FDROID_APK_NAME}"
          gsutil cp "signed-output/${FDROID_APK_NAME}" \
            "gs://${GCS_BUCKET}/fdroid-staging/is.pyrosec.unrasp.apk"

          # Also upload versioned release
          gsutil cp "$SIGNED_APK" "gs://${GCS_BUCKET}/apks/unrasp/v${VERSION}/"
          gsutil cp "$SIGNED_APK" "gs://${GCS_BUCKET}/apks/unrasp/latest/"

          echo "APK uploaded to GCS"

          # Copy to F-Droid pod and trigger repo update
          gcloud container clusters get-credentials ghost-cluster \
            --zone us-central1-a --project ${GCP_PROJECT} 2>/dev/null || true

          FDROID_POD=$(kubectl get pods -n ghost -l app=fdroid \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")

          if [ -n "$FDROID_POD" ]; then
            echo "Copying APK to F-Droid pod: $FDROID_POD"

            kubectl cp "signed-output/is.pyrosec.unrasp.apk" \
              "ghost/${FDROID_POD}:/fdroid/repo/is.pyrosec.unrasp.apk"

            # Trigger fdroid update
            kubectl exec -n ghost "$FDROID_POD" -- bash -c \
              "export FDROID_KEYSTORE_PASSWORD='${FDROID_KEYSTORE_PASSWORD}' FDROID_KEY_PASSWORD='${FDROID_KEY_PASSWORD}' && cd /fdroid && fdroid update --create-metadata 2>&1"

            echo "F-Droid repository updated at f-droid.pyrosec.is with version $VERSION"
          else
            echo "F-Droid pod not found — APK is staged in GCS for manual deployment"
          fi

      # ── Create GitHub Release ─────────────────────────────────
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: signed-output/*.apk
          generate_release_notes: true
          body: |
            ## UnRASP v${{ steps.version.outputs.version }}

            Generic freeRASP bypass LSPosed module — defeats Talsec root/tamper detection in any app.

            ### Install via F-Droid
            Add our F-Droid repository: https://f-droid.pyrosec.is

            ### Direct Download
            Download the signed APK from the assets below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
